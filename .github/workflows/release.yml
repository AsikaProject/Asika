name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-26-intel
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Checkout pack
        uses: actions/checkout@v6
        with:
          repository: AsikaProject/pack
          path: pack
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.version }}"
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          LDFLAGS="-s -w -X 'asika/common/version.Version=${TAG}' -X 'asika/common/version.Enabled=true' -X 'asika/common/version.Channel=release'"

          mkdir -p bin

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="${LDFLAGS}" -o "bin/asikad-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/asikad/main.go

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="${LDFLAGS}" -o "bin/asika-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/asika/main.go

      - name: Package tarballs and generate checksums
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.version }}"
          mkdir -p dist
          PKG="asika-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "dist/${PKG}"
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          cp "bin/asikad-${{ matrix.goos }}-${{ matrix.goarch }}$EXT" "dist/${PKG}/asikad${EXT}"
          cp "bin/asika-${{ matrix.goos }}-${{ matrix.goarch }}$EXT" "dist/${PKG}/asika${EXT}"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            cp pack/templates/service/asikad.service "dist/${PKG}/"
            cp pack/templates/service/asikad.openrc "dist/${PKG}/"
          fi
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            cp pack/templates/service/com.asika.daemon.plist "dist/${PKG}/"
          fi
          cp pack/doc/asika.1 "dist/${PKG}/"
          cp pack/doc/asikad.1 "dist/${PKG}/"
          cp pack/doc/asika.html "dist/${PKG}/"
          cp pack/doc/asikad.html "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
          sha256sum "bin/asikad-${{ matrix.goos }}-${{ matrix.goarch }}$EXT" > "dist/asikad-${{ matrix.goos }}-${{ matrix.goarch }}.sha256sum"
          sha256sum "bin/asika-${{ matrix.goos }}-${{ matrix.goarch }}$EXT"  > "dist/asika-${{ matrix.goos }}-${{ matrix.goarch }}.sha256sum"

      - uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256sum

  package-deb:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout pack
        uses: actions/checkout@v6
        with:
          repository: AsikaProject/pack
          path: pack
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package-disabled binaries
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # Strip the leading 'v' so Version matches the release tarball format.
          TAG="${TAG#v}"
          LDFLAGS="-s -w -X 'asika/common/version.Version=${TAG}' -X 'asika/common/version.Enabled=false' -X 'asika/common/version.Channel=package'"
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -ldflags="${LDFLAGS}" -o bin/asikad ./cmd/asikad/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -ldflags="${LDFLAGS}" -o bin/asika ./cmd/asika/main.go

      - name: Package DEB
        run: bash pack/scripts/package-deb.sh
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Verify package output
        shell: bash
        run: |
          if ! ls dist/*.deb 2>/dev/null >/dev/null; then
            echo "::error::No .deb package produced for ${{ matrix.goarch }}"
            exit 1
          fi
          ls -lh dist/*.deb

      - uses: actions/upload-artifact@v6
        with:
          name: deb-packages-${{ matrix.goarch }}
          path: dist/*.deb

  package-pkg:
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout pack
        uses: actions/checkout@v6
        with:
          repository: AsikaProject/pack
          path: pack
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package-disabled binaries
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          TAG="${TAG#v}"
          LDFLAGS="-s -w -X 'asika/common/version.Version=${TAG}' -X 'asika/common/version.Enabled=false' -X 'asika/common/version.Channel=package'"
          mkdir -p bin
          CGO_ENABLED=0 GOOS=darwin GOARCH=${{ matrix.goarch }} \
            go build -ldflags="${LDFLAGS}" -o bin/asikad ./cmd/asikad/main.go
          # PKG installer historically only ships asikad; keep parity with prior releases.
          cp bin/asikad bin/asikad-darwin-${{ matrix.goarch }}

      - name: Package PKG
        run: bash pack/scripts/package-pkg.sh
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Verify package output
        shell: bash
        run: |
          if ! ls dist/*.pkg 2>/dev/null >/dev/null; then
            echo "::error::No .pkg package produced for ${{ matrix.goarch }}"
            exit 1
          fi
          ls -lh dist/*.pkg

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-packages-${{ matrix.goarch }}
          path: dist/*.pkg

  package-inno:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout pack
        uses: actions/checkout@v6
        with:
          repository: AsikaProject/pack
          path: pack
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package-disabled binaries
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          TAG="${TAG#v}"
          LDFLAGS="-s -w -X 'asika/common/version.Version=${TAG}' -X 'asika/common/version.Enabled=false' -X 'asika/common/version.Channel=package'"
          mkdir -p bin
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags="${LDFLAGS}" -o bin/asika.exe ./cmd/asika/main.go
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags="${LDFLAGS}" -o bin/asikad.exe ./cmd/asikad/main.go

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --limit-output
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: Package Inno Setup
        shell: bash
        run: bash pack/scripts/package-inno.sh
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Move Inno output to dist/
        shell: bash
        run: |
          set -e
          mkdir -p dist
          mv inno-build/Output/*-setup.exe dist/ || \
            mv inno-build/Output/*.exe "dist/asika-${{ github.ref_name }}-setup.exe"
          ls -lh dist/

      - name: Verify package output
        shell: bash
        run: |
          if ! ls dist/*-setup.exe 2>/dev/null >/dev/null; then
            echo "::error::No setup.exe produced"
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: inno-packages
          path: dist/*-setup.exe

  package-docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout pack
        uses: actions/checkout@v6
        with:
          repository: AsikaProject/pack
          path: pack
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package-disabled binaries
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          TAG="${TAG#v}"
          LDFLAGS="-s -w -X 'asika/common/version.Version=${TAG}' -X 'asika/common/version.Enabled=false' -X 'asika/common/version.Channel=package'"
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="${LDFLAGS}" -o bin/asikad ./cmd/asikad/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="${LDFLAGS}" -o bin/asika ./cmd/asika/main.go

      - name: Package Docker
        run: bash pack/scripts/package-docker.sh
        env:
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_IMAGE_NAME: asikaproject/asika

  release:
    needs: [build, package-deb, package-pkg, package-inno, package-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: binaries-*
          path: binaries/
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          pattern: '*-packages'
          path: packages/
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== binaries/ ==="
          ls -la binaries/ || true
          echo "=== packages/ ==="
          ls -laR packages/ || true

      - name: Prepare release assets
        run: |
          set -e
          mkdir -p release-assets
          cp binaries/*.tar.gz release-assets/
          cp binaries/*.sha256sum release-assets/
          cp packages/deb-packages-*/* release-assets/
          cp packages/pkg-packages-*/* release-assets/
          cp packages/inno-packages/* release-assets/
          ls -lh release-assets/
          wget -q https://github.com/AsikaProject/asika/raw/main/ChangeLog.md -O release-assets/ChangeLog.md

      - name: Verify all expected assets present
        run: |
          set -e
          expected_assets=(
            "asika-linux-amd64.tar.gz" "asika-linux-arm64.tar.gz"
            "asika-darwin-amd64.tar.gz" "asika-darwin-arm64.tar.gz"
            "asika-windows-amd64.tar.gz"
            "asikad-linux-amd64.sha256sum" "asikad-linux-arm64.sha256sum"
            "asikad-darwin-amd64.sha256sum" "asikad-darwin-arm64.sha256sum"
            "asikad-windows-amd64.sha256sum"
            "asika-linux-amd64.sha256sum" "asika-linux-arm64.sha256sum"
            "asika-darwin-amd64.sha256sum" "asika-darwin-arm64.sha256sum"
            "asika-windows-amd64.sha256sum"
          )
          missing=0
          for f in "${expected_assets[@]}"; do
            if [ ! -f "release-assets/$f" ]; then
              echo "::error file=$f::Missing required asset: $f"
              missing=$((missing+1))
            fi
          done
          # Packaged installers: each must be present.
          for pattern in 'asika*_amd64.deb' 'asika*_arm64.deb' 'asika-*.pkg' 'asika-*-setup.exe'; do
            if ! ls release-assets/$pattern >/dev/null 2>&1; then
              echo "::error::Missing package asset matching: $pattern"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing required asset(s) missing; refusing to publish"
            exit 1
          fi
          echo "All expected assets present."

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
